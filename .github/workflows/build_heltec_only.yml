name: Build Heltec Only

on:
  push:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - "**.md"
      - version.properties

  pull_request:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - "**.md"

  workflow_dispatch:

permissions: read-all

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get release version string
        run: |
          echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
        id: version
        env:
          BUILD_LOCATION: local
    outputs:
      long: ${{ steps.version.outputs.long }}

  build-heltec-wireless-tracker:
    needs: version
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: ${{ needs.version.outputs.long }}
      pio_env: heltec-wireless-tracker
      platform: esp32s3

  build-heltec-wsl-v3:
    needs: version
    uses: ./.github/workflows/build_firmware.yml
    with:
      version: ${{ needs.version.outputs.long }}
      pio_env: heltec-wsl-v3
      platform: esp32s3

  gather-artifacts:
    runs-on: ubuntu-latest
    needs: [version, build-heltec-wireless-tracker, build-heltec-wsl-v3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: ./output
          pattern: firmware-esp32s3-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -lR ./output

      - name: Zip firmware
        run: zip -j -9 -r ./firmware-heltec-${{ needs.version.outputs.long }}.zip ./output

      - name: Upload combined firmware
        uses: actions/upload-artifact@v6
        with:
          name: firmware-heltec-${{ needs.version.outputs.long }}
          overwrite: true
          path: |
            ./output/*.mt.json
            ./output/*.bin
            ./output/*.elf
            ./output/*.zip
            ./output/device-*.sh
            ./output/device-*.bat
          retention-days: 30
